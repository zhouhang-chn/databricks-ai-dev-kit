golden_eval_case:
  id: "visit_coverage_drop_001"
  scenario: "Sales execution / visit coverage diagnosis"
  scenario_id: "bdr_visit_efficiency_diagnosis"
  requirement_id: "visit_coverage_drop_april"
  analyst_trace_ref: "manual-traces/visit-coverage-drop-april.yaml"
  user_question: "Why did visit coverage drop last month?"
  status: "draft_pending_manual_trace_results"

  expected_scoping:
    metric: "visit_coverage_rate"
    grain: "region x month"
    population: "active assigned eligible POCs"
    comparison: "previous complete month"
    ambiguity_handling:
      - "ask region if required by product flow, or default to national with caveat"
      - "confirm coverage definition when metric catalog has multiple coverage metrics"

  expected_context_discovery:
    required_metrics:
      - "visit_coverage_rate"
    required_tables:
      - "visit fact"
      - "POC dimension"
      - "BDR assignment"
      - "calendar"
    required_rules:
      - "valid visit status"
      - "business day cutoff"
      - "stable employee ID"
      - "active eligible assigned POC denominator"

  expected_plan:
    - "headline trend"
    - "regional contribution"
    - "numerator / denominator decomposition"
    - "BDR capacity check"
    - "POC tier impact"
    - "data quality validation"

  expected_execution:
    sql_assertions:
      - "does not use SELECT *"
      - "uses distinct POC count"
      - "uses correct date window"
      - "uses approved join keys"
      - "aggregates at correct grain"
      - "does not execute write, DDL, or grant statements"

  expected_validation:
    - "freshness"
    - "row counts"
    - "join cardinality"
    - "denominator change"
    - "dashboard reconciliation when available"

  expected_answer:
    headline_pattern: "Coverage decline was mainly driven by..."
    must_include:
      - "magnitude of decline"
      - "top contributing segment"
      - "primary driver"
      - "confidence"
      - "next action"

  stage_scoring:
    scoping:
      correct_metric: 2
      correct_time_window: 2
      correct_population: 2
      identifies_ambiguity: 2
      avoids_premature_sql: 2
    discovery:
      finds_metric_definition: 3
      finds_correct_fact_table: 3
      finds_required_dimensions: 2
      finds_known_pitfalls: 2
    planning:
      business_relevance: 3
      decomposition_quality: 3
      validation_plan: 2
      avoids_overclaiming_causality: 2
    execution:
      metric_correctness: 4
      join_correctness: 2
      date_correctness: 2
      grain_correctness: 2
    validation:
      performs_freshness_check: 2
      performs_cardinality_check: 2
      performs_metric_sanity_check: 2
      catches_obvious_data_issue: 4
    answer:
      conclusion_quality: 3
      evidence_quality: 3
      driver_analysis: 3
      caveats_and_confidence: 2
      actionability: 2

  scoring:
    total_points: 100
