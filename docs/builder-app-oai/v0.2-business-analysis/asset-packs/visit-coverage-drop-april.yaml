analysis_asset_pack:
  id: "visit_coverage_drop_april_asset_pack"
  requirement_id: "visit_coverage_drop_april"
  status: "draft_requires_source_confirmation"

  metric_definitions:
    - "context-assets/visit-coverage-rate.yaml"

  data_asset_profiles:
    - "context-assets/visit-info-daily-fact.yaml"

  required_data_assets:
    facts:
      - name: "visit_info_daily_fact"
        role: "valid visit events and BDR activity"
        preferred: true
    dimensions:
      - name: "poc_dimension"
        role: "active eligible POC population and POC tier"
      - name: "employee_dimension"
        role: "stable BDR identity and org attributes"
      - name: "calendar_dimension"
        role: "month boundaries, working days, and comparable periods"
    bridges:
      - name: "poc_bdr_assignment"
        role: "eligible POC denominator and territory ownership"
      - name: "region_hierarchy"
        role: "region, city, and territory drilldown"

  approved_joins:
    - left: "visit_info_daily_fact.poc_id"
      right: "poc_dimension.poc_id"
      expected_cardinality: "many_to_one"
      caveat: "filter to active eligible POCs for denominator analysis"
    - left: "visit_info_daily_fact.employee_no"
      right: "employee_dimension.employee_no"
      expected_cardinality: "many_to_one"
      caveat: "do not join on employee name"
    - left: "poc_dimension.poc_id"
      right: "poc_bdr_assignment.poc_id"
      expected_cardinality: "one_to_many_over_time"
      caveat: "apply effective-date window to avoid assignment duplication"
    - left: "visit_info_daily_fact.visit_date"
      right: "calendar_dimension.calendar_date"
      expected_cardinality: "many_to_one"
      caveat: "use business calendar rules when available"

  glossary:
    BDR: "Business Development Representative"
    POC: "Point of consumption / outlet / customer location"
    coverage: "share of eligible POCs visited at least once in selected period"
    eligible_poc: "active POC assigned to a BDR-managed channel"

  canonical_sql_examples:
    - id: "monthly_coverage"
      purpose: "current versus baseline visit coverage"
      status: "to_be_authored_from_manual_trace"
    - id: "regional_contribution"
      purpose: "rank regions by contribution to total coverage movement"
      status: "to_be_authored_from_manual_trace"
    - id: "bdr_productivity"
      purpose: "check active BDRs and visits per BDR"
      status: "to_be_authored_from_manual_trace"

  validation_checklists:
    - "freshness"
    - "daily row-count trend"
    - "null rate for stable join keys"
    - "duplicate visit_id"
    - "assignment join cardinality"
    - "denominator reconciliation"

  known_pitfalls:
    - "late-arriving visits can mimic coverage decline"
    - "assignment changes can create artificial rep or region movement"
    - "all-POC denominator overstates the population"
    - "visit count is not the same as distinct visited POCs"

  access_constraints:
    - "respect project catalog/schema/warehouse defaults"
    - "do not expose row-level POC or employee details unless user role permits"
