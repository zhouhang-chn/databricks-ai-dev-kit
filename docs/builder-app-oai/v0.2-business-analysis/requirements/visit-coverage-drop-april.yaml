analysis_requirement:
  id: "visit_coverage_drop_april"
  scenario_id: "bdr_visit_efficiency_diagnosis"
  requirement_type: "diagnostic_decomposition"
  question: "Why did visit coverage drop in April?"
  question_variants:
    - "Why did coverage drop last month?"
    - "Which regions drove the visit coverage decline?"
    - "Did the drop come from fewer visits or a larger eligible POC base?"
    - "Are high-value POCs under-served after the coverage drop?"
  business_intent: >-
    Understand whether the decline is due to rep activity, POC population
    change, routing inefficiency, working-day effects, or data quality issues.
  decision_to_support: >-
    Decide whether to adjust BDR territory, visit target, coaching focus, or
    data quality process.

  metric:
    primary_metric: "visit_coverage_rate"
    numerator: "distinct visited POCs"
    denominator: "target / eligible POCs"
    grain: "region x month"
    owner: "Sales Ops"

  scope:
    time_window: "April 2026"
    comparison_baseline:
      - "March 2026"
      - "April 2025 if available"
    population: "active BDR-managed POCs"
    exclusions:
      - "inactive POCs"
      - "test accounts"
      - "non-BDR channels"

  required_dimensions:
    - "region"
    - "city"
    - "bdr"
    - "poc_tier"
    - "channel"
    - "working_day"

  expected_output:
    - "headline conclusion"
    - "metric movement"
    - "top contributing regions / reps / POC tiers"
    - "likely drivers"
    - "validation checks"
    - "recommended next actions"

  ambiguity_to_resolve:
    - "Does coverage mean POC visited at least once, or visit-frequency adherence?"
    - "Should denominator be all eligible POCs or planned POCs?"
    - "Should last month mean the previous complete month or month-to-date?"
    - "Should the analysis default to national scope if no region is provided?"

  caveats_to_preserve:
    - "Do not claim causality without experiment or stronger identification."
    - "Call out denominator expansion separately from numerator decline."
    - "Check whether data freshness or visit-status filtering explains the movement."
