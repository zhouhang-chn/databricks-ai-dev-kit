# Minimal user-authored project setting.
# The Builder Agent turns this input into structured business and data context.

business_background: >-
  Evaluate SKU distribution completion status at POC-Group-month level as M1 performance.


analysis_notes:
  - We will assess m1 KPI achievement from two perspectives: by POC level and by POC × group level.
  - Each (POC, group_code) combination represents a KPI requirement assigned to a specific employee (m1_no).
  - Each group_code may correspond to multiple mha_sku_key, indicating a one-to-many mapping between KPI group and SKU keys.
  - KPI assignments and definitions may vary by month, so all analysis must be performed with month-level alignment.
  - The field m1_no represents the employee identifier (employee_no).
  - The field poc_middle_id represents the POC identifier (poc_id).
  - The field group_code represents the KPI group assigned to each employee for each POC.
  - Prefer registered Databricks Metric Views for governed MHA achievement, KPI benchmark, trend, ranking, and reconciliation questions.
  - Use raw source tables for validation, row-level drill-down, and unsupported exploratory questions only when the Metric View path is missing or insufficient.

